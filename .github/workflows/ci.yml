name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            appstream \
            blueprint-compiler \
            desktop-file-utils \
            gettext \
            glib2-devel \
            gtk4-devel \
            libadwaita-devel \
            meson \
            ninja-build \
            python3-gobject \
            xorg-x11-server-Xvfb

      - name: Build
        run: |
          meson setup build --prefix="$PWD/build-install"
          meson compile -C build

      - name: Test
        run: xvfb-run --auto-servernum meson test -C build --print-errorlogs

      - name: Install
        run: meson install -C build

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: fedora:45
    steps:
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          dnf install -y \
            appstream \
            blueprint-compiler \
            curl \
            desktop-file-utils \
            gettext \
            glib2-devel \
            gtk4-devel \
            libadwaita-devel \
            meson \
            ninja-build \
            python3-gobject \
            xorg-x11-server-Xvfb

      - name: Reject obvious secrets
        run: |
          if git grep -l -I -E \
            'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|xox[abposr]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----|https?://[^/[:space:]:@]+:[^/[:space:]@]+@' \
            -- .; then
            echo "Potential credentials found in tracked files" >&2
            exit 1
          fi

      - name: Lint Blueprints
        run: |
          for file in src/*.blp; do
            blueprint-compiler lint "$file"
          done

      - name: Check AppImage build script
        run: sh -n scripts/build-appimage.sh

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Type-check and lint
        run: |
          uvx pyright src tests scripts dev.py
          uvx ruff check --select E9,F63,F7,F82,F401,I001 \
            src tests scripts dev.py

      - name: Build
        run: |
          meson setup build --prefix="$PWD/build-install"
          meson compile -C build

      - name: Test
        run: xvfb-run --auto-servernum python3 scripts/test.py

      - name: Install
        run: meson install -C build

      - name: Smoke-test installed launcher
        run: |
          xvfb-run --auto-servernum timeout 5s \
            ./build-install/bin/hello || test "$?" -eq 124

  flatpak-lint:
    name: Flatpak lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
      volumes:
        # Keep Flatpak's system installation on a volume so runtime updates
        # rename within one filesystem instead of hitting overlayfs EXDEV.
        - flatpak-installation:/var/lib/flatpak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check app ID matches repository
        env:
          MANIFEST: com.example.Hello.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          with open(os.environ["MANIFEST"], encoding="utf-8") as handle:
              manifest = json.load(handle)
          app_id = manifest.get("id") or manifest.get("app-id", "")
          parts = app_id.split(".")
          if parts[:2] != ["io", "github"]:
              raise SystemExit(0)

          repo = os.environ["GITHUB_REPOSITORY"]
          if len(parts) != 4:
              sys.exit(f"{app_id}: io.github app IDs need four components")
          expected = f"{parts[2]}/{parts[3]}".lower()
          if expected != repo.lower():
              sys.exit(
                  f"{app_id}: last two components must match {repo}. "
                  "Rename the repository to match the app ID or use a "
                  "domain-based app ID."
              )
          print(f"{app_id} matches {repo}")
          PY

      - name: Build Flatpak repository
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: com.example.Hello.json
          bundle: hello.flatpak
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: false

      - name: Lint manifest
        run: flatpak-builder-lint manifest com.example.Hello.json

      - name: Lint repository when screenshots are configured
        run: |
          # Parse the XML so the commented-out <screenshots> example in the
          # template does not count as a configured screenshot.
          if python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("data/com.example.Hello.metainfo.xml.in").getroot()
          sys.exit(0 if root.find("screenshots") is not None else 1)
          PY
          then
            flatpak-builder-lint repo repo
          else
            echo "Skipping repo lint: add a public AppStream screenshot first."
          fi

# PyGObject and the GTK/libadwaita runtime come from the system; Meson installs
# the application itself. This is not a distributable Python package; the file
# only describes the optional dev environment.

[project]
name = "hello"
version = "0.1.0"
description = "A GTK 4 and libadwaita application"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "James Doyle", email = "james2doyle@gmail.com" }
]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.20.0",
]

[tool.uv]
package = false
